<h2 class="sr-only">Animated pixel-art viewer of the MaleBody_Muscular character with tendons drawn on the feet and hands and a lighter foot mesh, with buttons to switch test animations, view and zoom.</h2>
<div style="padding:.5rem 0 1rem">
<div style="background:var(--surface-1);border-radius:12px;padding:12px;display:flex;justify-content:center">
<canvas id="mbl-cv" width="72" height="88" style="width:288px;height:352px;image-rendering:pixelated;touch-action:pan-y;cursor:grab"></canvas>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
<button id="mbl-a-arms" style="flex:1 1 76px">Arms</button>
<button id="mbl-a-toes" style="flex:1 1 76px">Toes</button>
<button id="mbl-a-head" style="flex:1 1 76px">Head</button>
<button id="mbl-a-wave" style="flex:1 1 76px">Wave</button>
<button id="mbl-a-walk" style="flex:1 1 76px">Walk</button>
<button id="mbl-a-idle" style="flex:1 1 76px">Idle</button>
<button id="mbl-a-wrists" style="flex:1 1 76px">Wrists</button>
<button id="mbl-a-fingers" style="flex:1 1 76px">Fingers</button>
</div>
<div style="display:flex;gap:8px;margin-top:8px">
<button id="mbl-view" style="flex:3 1 0;min-width:0">View: front</button>
<button id="mbl-zoom" style="flex:3 1 0;min-width:0">Zoom: feet</button>
<button id="mbl-turn" aria-pressed="false" style="flex:2 1 0;min-width:0">Turn</button>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:14px">
<label for="mbl-speed" style="font-size:14px;color:var(--text-secondary);min-width:72px">Speed</label>
<input type="range" id="mbl-speed" min="30" max="170" step="1" value="100" style="flex:1">
<span id="mbl-speed-out" style="font-size:14px;font-weight:500;min-width:44px;text-align:right">100%</span>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:10px">
<label for="mbl-key" style="font-size:14px;color:var(--text-secondary);min-width:72px">Key angle</label>
<input type="range" id="mbl-key" min="-90" max="90" step="1" value="-40" style="flex:1">
<span id="mbl-key-out" style="font-size:14px;font-weight:500;min-width:44px;text-align:right">-40°</span>
</div>
</div>
